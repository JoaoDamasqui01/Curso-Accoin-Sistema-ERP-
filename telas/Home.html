<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <link rel="stylesheet" href="../style/homeStyle.css">
</head>

<body>

    <div class="topo-menu">

        <div class="menu-esquerda">

           
           
            <div class="dropdown">
                <button class="btn btn-primary dropdown-toggle" type="button" aria-expanded="false">
                    Cadastros
                </button>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="Categoria.html">Categorias</a></li>
                    <li><a class="dropdown-item" href="Cliente.html">Clientes</a></li>
                    <li><a class="dropdown-item" href="Produto.html">Produtos</a></li>
                </ul>
            </div>

        
            <div class="dropdown">
                <button class="btn btn-warning dropdown-toggle" type="button" aria-expanded="false">
                    Manutenção
                </button>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="usuarios.html">Usuários</a></li>
                </ul>
            </div>

            <a href="Orcamento.html"><button type="button" class="btn btn-pesquisar">Orçamentos</button></a>
        </div>

        
        <a href="login.html"><button type="button" class="btn btn-danger">Sair</button></a>

    </div>


    <!-- Área Central da Logo -->
    <section class="faixa-destaque" aria-label="Destaque visual">
        <div class="centro-logo">
            <img src="../Imagem/Tintas.jpg" alt="Logo da Empresa">
        </div>
    </section>


    <script>
        document.querySelectorAll('.dropdown-toggle').forEach((botao) => {
            botao.addEventListener('click', () => {
                const dropdown = botao.closest('.dropdown');
                const estaAberto = dropdown.classList.toggle('aberto');
                botao.setAttribute('aria-expanded', estaAberto);
            });
        });

        document.addEventListener('click', (evento) => {
            if (!evento.target.closest('.dropdown')) {
                document.querySelectorAll('.dropdown.aberto').forEach((dropdown) => {
                    dropdown.classList.remove('aberto');
                    dropdown.querySelector('.dropdown-toggle').setAttribute('aria-expanded', 'false');
                });
            }
        });
    </script>

</body>

</html>
