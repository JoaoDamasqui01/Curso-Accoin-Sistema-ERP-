<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir Senha - DittoFlow</title>
  <link rel="stylesheet" href="../style/loginStyle.css">
</head>

<body>
  <main class="card-login">
    <form id="formRedefinirSenha" class="form-body" novalidate>
      <div class="campo">
        <label for="senha">Nova Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Sua nova senha" required minlength="6">
      </div>

      <div class="campo">
        <label for="confirmarSenha">Confirmar Nova Senha</label>
        <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Confirme a nova senha" required minlength="6">
      </div>

      <div id="mensagemStatus" class="mensagem-erro" role="alert" aria-live="polite"></div>

      <button type="submit" class="btn-login" id="btnRedefinir">Salvar Nova Senha</button>

      <div class="forgot-password-container">
        <a href="Login.html" class="forgot-password">← Voltar para o Login</a>
      </div>
    </form>

    <div class="login-image-container">
      <img src="../Imagem/dittoFlow.png" alt="Logo ERP" class="login-image">
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="../javascript/redefinirSenha.js"></script>
</body>

</html>
