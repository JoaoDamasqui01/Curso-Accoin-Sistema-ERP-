<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style/universalStyle.css">
    <title>Cadastro de Produto</title>
</head>

<body>

    <menu-page></menu-page>

    <main class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1>Cadastro de Produto</h1>
            <!-- Botão para abrir a listagem flutuante -->
            <button type="button" id="btnListarProdutosModal" class="btn-pesquisar">
                📋 Listar em Janela Flutuante
            </button>
        </div>

        <form id="formProduto" class="form-cliente">

            <div class="campo">
                <label for="produtoId">Código</label>
                <input type="number" id="produtoId" placeholder="Gerado automaticamente" readonly>
            </div>

            <div class="campo">
                <label for="dsProduto">Descrição / Nome do Produto</label>
                <input type="text" id="dsProduto" maxlength="100" placeholder="Ex: Tinta Acrílica Fosca 18L" required>
            </div>

            <div class="campo">
                <label for="categoriaProdutoId">Categoria</label>
                <select id="categoriaProdutoId" required>
                    <option value="">Carregando categorias...</option>
                </select>
            </div>

            <div class="campo">
                <label for="unidadeMediada">Unidade de Medida:</label>
                <select id="unidadeMediada">
                    <option value="">Selecione a embalagem...</option>
                    <option value="Lata 18L">Lata 18L</option>
                    <option value="Galão 3.6L">Galão 3.6L</option>
                    <option value="Quartinho 900mL">Quartinho 900mL</option>
                    <option value="Bisnaga 50mL">Bisnaga 50mL</option>
                    <option value="Unidade">Unidade (Ferramenta/Utensílio)</option>
                </select>
            </div>

            <div class="campo">
                <label for="rendimentoPorLitro">Rendimento p/ Litro (m²/L):</label>
                <input type="number" id="rendimentoPorLitro" step="0.1" min="0" placeholder="Ex: 10 (Se aplicável)">
            </div>

            <div class="campo">
                <label for="rendimentoM2">Rendimento Total da Embalagem (m²):</label>
                <input type="number" id="rendimentoM2" placeholder="Calculado automaticamente" readonly>
            </div>

            <div class="campo">
                <label for="marca">Marca</label>
                <input type="text" id="marca" placeholder="Ex: Suvinil, Coral, Tigre">
            </div>

            <div class="campo">
                <label for="cor">Cor:</label>
                <input type="text" id="cor" maxlength="30" placeholder="Ex: Branco Neve">
            </div>

            <div class="campo">
                <label for="acabamento">Acabamento</label>
                <input type="text" id="acabamento" placeholder="Semi-Brilho, Brilhante, Texturizada, Acetinado">
            </div>

            <div class="campo">
                <label for="vlVendaProduto">Valor de Venda (R$)</label>
                <input type="number" id="vlVendaProduto" step="0.01" min="0" placeholder="0,00" required>
            </div>

            <div class="campo">
                <label for="statusProduto">Status</label>
                <select id="statusProduto" required>
                    <option value="A">Ativo</option>
                    <option value="I">Inativo</option>
                </select>
            </div>

            <div class="campo nome">
                <label for="obsProduto">Observação</label>
                <input type="text" id="obsProduto" maxlength="255" placeholder="Digite uma observação do produto">
            </div>

            <div class="acoes">

                <button type="reset" class="btn-limpar">Limpar</button>
                <button type="button" id="btnCancelarEdicao" class="btn-cancelar-edicao" style="display: none;">Cancelar
                    edição</button>
                <button type="submit" id="btnSalvar" class="btn-salvar">Salvar</button>
            </div>

            <p id="mensagem" class="mensagem"></p>

        </form>

    </main>

    <!-- Estrutura do Modal Flutuante -->
    <div id="modalListagem" class="modal-overlay" style="display: none;">
        <div class="modal-conteudo">
            <div class="modal-header">
                <div>
                    <p class="lista-produtos__eyebrow">Catálogo</p>
                    <h2 id="tituloProdutos">Produtos cadastrados</h2>
                </div>
                <button type="button" id="btnFecharModal" class="btn-fechar">&times;</button>
            </div>

            <div class="modal-body">
                <div class="modal-pesquisa" role="search">
                    <label class="sr-only" for="campoPesquisa">Pesquisar produtos</label>
                    <input type="search" id="campoPesquisa" maxlength="100" placeholder="Buscar por nome do produto">
                    <button type="button" id="btnPesquisar" class="btn-pesquisar">Buscar</button>
                </div>

                <div class="tabela-produtos-wrapper" tabindex="0">
                <table class="tabela-produtos">
                    <caption class="sr-only">Lista de produtos cadastrados</caption>
                    <thead>
                        <tr>
                            <th scope="col">Produto</th>
                            <th scope="col">Categoria</th>
                            <th scope="col">Marca</th>
                            <th scope="col">Cor e acabamento</th>
                            <th scope="col">Rendimento</th>
                            <th scope="col">Valor de venda</th>
                            <th scope="col">Status</th>
                            <th scope="col">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaProdutos">
                        <tr>
                            <td colspan="8">Carregando...</td>
                        </tr>
                    </tbody>
                </table>
                </div>

                <nav id="paginacaoProdutos" class="paginacao-produtos" aria-label="Paginação de produtos" hidden>
                    <button type="button" id="btnPaginaAnterior" class="btn-pagina">Anterior</button>
                    <span id="infoPaginacao" aria-live="polite"></span>
                    <button type="button" id="btnProximaPagina" class="btn-pagina">Próxima</button>
                </nav>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="../javascript/Produto.js"></script>
    <script src="../componente/menu/menu.js"></script>

</body>

</html>
