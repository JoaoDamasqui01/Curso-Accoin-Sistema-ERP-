<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style/universalStyle.css">
    <title>Cadastro de Cliente</title>
</head>
<body>
    <menu-page></menu-page>
    <main class="container">
        <div class="pagina-cabecalho">
            <h1>Cadastro de Cliente</h1>
            <button type="button" id="btnListarClientesModal" class="btn-pesquisar">📋 Listar Clientes</button>
        </div>

        <form id="formCliente" class="form-cliente">
            <div class="campo">
                <label for="clienteId">Código</label>
                <input type="number" id="clienteId" placeholder="Gerado automaticamente" readonly>
            </div>

            <div class="campo">
                <label for="tipoCliente">Tipo de cliente</label>
                <select id="tipoCliente" required>
                    <option value="">Selecione</option>
                    <option value="F">Pessoa física</option>
                    <option value="J">Pessoa jurídica</option>
                </select>
            </div>

            <div class="campo">
                <label for="nomeCliente">Nome do cliente</label>
                <input type="text" id="nomeCliente" maxlength="100" placeholder="Digite o nome do cliente" required>
            </div>

            <div class="campo">
                <label for="cpfCnpjCliente">CPF / CNPJ</label>
                <input type="text" id="cpfCnpjCliente" maxlength="18" placeholder="Digite o CPF ou CNPJ">
            </div>

            <div class="campo">
                <label for="telefone">Telefone / Celular</label>
                <input type="text" id="telefone" maxlength="20" placeholder="(00) 00000-0000">
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" maxlength="100" placeholder="cliente@email.com">
            </div>

            <div class="campo full-width">
                <label for="endereco">Endereço</label>
                <input type="text" id="endereco" maxlength="150" placeholder="Rua, número, bairro, cidade">
            </div>

            <div class="acoes">
                <button type="reset" id="btnLimpar" class="btn-limpar">Limpar</button>
                <button type="button" id="btnCancelarEdicao" class="btn-cancelar-edicao" style="display: none;">Cancelar edição</button>
                <button type="submit" id="btnSalvar" class="btn-salvar">Salvar</button>
            </div>
            <p id="mensagem" class="mensagem" aria-live="polite"></p>
        </form>
    </main>

    <!-- MODAL DE LISTAGEM -->
    <div id="modalListagem" class="modal-overlay" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="tituloClientes">
        <div class="modal-conteudo">
            <div class="modal-header">
                <div>
                    <p class="lista-produtos__eyebrow">Cadastro</p>
                    <h2 id="tituloClientes">Clientes cadastrados</h2>
                </div>
                <button type="button" id="btnFecharModal" class="btn-fechar" aria-label="Fechar listagem">&times;</button>
            </div>
            <div class="modal-body">
                <div class="modal-pesquisa" role="search">
                    <label class="sr-only" for="campoPesquisa">Pesquisar clientes</label>
                    <input type="search" id="campoPesquisa" maxlength="100" placeholder="Buscar por nome ou CPF/CNPJ">
                    <button type="button" id="btnPesquisar" class="btn-pesquisar">Buscar</button>
                </div>
                <div class="tabela-produtos-wrapper" tabindex="0">
                    <table class="tabela-produtos tabela-clientes">
                        <caption class="sr-only">Lista de clientes cadastrados</caption>
                        <thead>
                            <tr>
                                <th scope="col">Cód.</th>
                                <th scope="col">Cliente</th>
                                <th scope="col">CPF / CNPJ</th>
                                <th scope="col">Tipo</th>
                                <th scope="col">Telefone</th>
                                <th scope="col">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaClientes">
                            <tr><td colspan="6">Carregando clientes...</td></tr>
                        </tbody>
                    </table>
                </div>
                <nav id="paginacaoClientes" class="paginacao-produtos" aria-label="Paginação de clientes" hidden>
                    <button type="button" id="btnPaginaAnterior" class="btn-pagina">Anterior</button>
                    <span id="infoPaginacao" aria-live="polite"></span>
                    <button type="button" id="btnProximaPagina" class="btn-pagina">Próxima</button>
                </nav>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="../javascript/Cliente.js"></script>
    <script src="../componente/menu/menu.js"></script>
</body>
</html>
