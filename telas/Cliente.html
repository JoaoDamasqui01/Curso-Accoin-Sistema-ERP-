<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style/universalStyle.css">

    <!-- Título que aparece na aba do navegador. -->
    <title>Cadastro de Cliente</title>
</head>

<body>

    <menu-page></menu-page>

    <!-- Conteúdo principal da página -->
    <main class="container">

        <!-- Título da tela -->
        <h1>Cadastro de Cliente</h1>

        <!-- Formulário usado tanto para cadastrar quanto para editar -->
        <form id="formCliente" class="form-cliente">

            <!-- Campo CLIENTEID.
           No banco ele é SERIAL, então é gerado automaticamente.
           Por isso o campo fica readonly. -->
            <div class="campo">
                <label for="clienteId">Código</label>
                <input type="number" id="clienteId" placeholder="Gerado automaticamente" readonly>
            </div>

            <!-- Campo TIPO_CLIENTE.
           Na tabela é CHAR(1), então salvamos apenas uma letra:
           F para Pessoa Física
           J para Pessoa Jurídica -->
            <div class="campo">
                <label for="tipoCliente">Tipo de Cliente</label>
                <select id="tipoCliente" required>
                    <option value="">Selecione</option>
                    <option value="F">Pessoa Física</option>
                    <option value="J">Pessoa Jurídica</option>
                </select>
            </div>

            <!-- Campo NOME_CLIENTE.
           Na tabela é VARCHAR(100), então usamos maxlength="100". -->
            <div class="campo">
                <label for="nomeCliente">Nome do Cliente</label>
                <input type="text" id="nomeCliente" maxlength="100" placeholder="Digite o nome do cliente" required>
            </div>

            <!-- Campo CPF_CNPJ_CLIENTE.
           Na tabela é VARCHAR(18), então usamos maxlength="18". -->
            <div class="campo">
                <label for="cpfCnpjCliente">CPF / CNPJ</label>
                <input type="text" id="cpfCnpjCliente" maxlength="18" placeholder="Digite o CPF ou CNPJ" required>
            </div>


            <div class="campo nome">
                <label for="campoPesquisa">Pesquisa de Cliente</label>
                <div class="campoPesquisa">
                    <input type="text" id="campoPesquisa" maxlength="100" placeholder="Pesquise por Nome ou CPF/CNPJ">
                    <button type="button" id="btnPesquisar" class="btn-pesquisar">Pesquisar</button>
                </div>
            </div>

            <!-- Botões do formulário -->
            <div class="acoes">

                <!-- Limpa os campos do formulário -->
                <button type="reset" class="btn-limpar">
                    Limpar
                </button>

                <!-- Cancela a edição e volta para o modo cadastro.
             Esse botão começa escondido. -->
                <button type="button" id="btnCancelarEdicao" class="btn-cancelar-edicao">
                    Cancelar edição
                </button>

                <!-- Botão principal.
             Quando estiver cadastrando, aparece como "Salvar".
             Quando estiver editando, o JavaScript muda para "Atualizar". -->
                <button type="submit" id="btnSalvar" class="btn-salvar">
                    Salvar
                </button>
            </div>
        </form>

        <!-- Aqui aparecerão mensagens como:
         "Cliente salvo com sucesso"
         "Erro ao salvar cliente"
         "Cliente excluído com sucesso" -->
        <p id="mensagem" class="mensagem"></p>

        <!-- Título da listagem -->
        <h2>Clientes Cadastrados</h2>

        <!-- Tabela onde os clientes serão exibidos -->
        <table>
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Nome</th>
                    <th>CPF / CNPJ</th>
                    <th>Tipo</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <!-- O tbody começa com uma mensagem.
           Depois o JavaScript substitui esse conteúdo pelos dados do Supabase. -->
            <tbody id="tabelaClientes">
                <tr>
                    <td colspan="5">Carregando clientes...</td>
                </tr>
            </tbody>
        </table>
    </main>

    <!-- Biblioteca JavaScript do Supabase.
       Ela precisa ser carregada antes do nosso app.js. -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Nosso arquivo JavaScript separado -->
    <script type="module" src="../javascript/Cliente.js"></script>
    <script src="../componente/menu/menu.js"></script>

</body>

</html>
