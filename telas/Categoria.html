<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style/universalStyle.css">
    <title>Cadastro de Categoria</title>
</head>
<body>
    <menu-page></menu-page>
    <main class="container">
        <div class="pagina-cabecalho">
            <h1>Cadastro de Categoria</h1>
            <button type="button" id="btnListarCategoriasModal" class="btn-pesquisar"> 📋 Listar Categorias</button>
        </div>
        <form id="formCategoriaProduto" class="form-cliente">
            <div class="campo">
                <label for="categoriaProdutoId">Código</label>
                <input type="number" id="categoriaProdutoId" placeholder="Gerado automaticamente" readonly>
            </div>
            <div class="campo">
                <label for="dsCategoriaProduto">Descrição / nome</label>
                <input type="text" id="dsCategoriaProduto" maxlength="100" placeholder="Ex.: Tintas, Ferramentas" required>
            </div>
            <div class="campo nome">
                <label for="obsCategoriaProduto">Observação</label>
                <input type="text" id="obsCategoriaProduto" maxlength="255" placeholder="Digite uma observação para a categoria" required>
            </div>
            <div class="acoes">
                <button type="reset" class="btn-limpar">Limpar</button>
                <button type="button" id="btnCancelarEdicao" class="btn-cancelar-edicao" style="display: none;">Cancelar edição</button>
                <button type="submit" id="btnSalvar" class="btn-salvar">Salvar</button>
            </div>
            <p id="mensagem" class="mensagem" aria-live="polite"></p>
        </form>
    </main>

    <div id="modalListagem" class="modal-overlay" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="tituloCategorias">
        <div class="modal-conteudo modal-categorias">
            <div class="modal-header">
                <div>
                    <p class="lista-produtos__eyebrow">Catálogo</p>
                    <h2 id="tituloCategorias">Categorias cadastradas</h2>
                </div>
                <button type="button" id="btnFecharModal" class="btn-fechar" aria-label="Fechar listagem">&times;</button>
            </div>
            <div class="modal-body">
                <div class="modal-pesquisa" role="search">
                    <label class="sr-only" for="campoPesquisa">Pesquisar categorias</label>
                    <input type="search" id="campoPesquisa" maxlength="100" placeholder="Buscar por nome da categoria">
                    <button type="button" id="btnPesquisar" class="btn-pesquisar">Buscar</button>
                </div>
                <div class="tabela-produtos-wrapper" tabindex="0">
                    <table class="tabela-produtos tabela-categorias">
                        <caption class="sr-only">Lista de categorias cadastradas</caption>
                        <thead><tr><th scope="col">Categoria</th><th scope="col">Observação</th><th scope="col">Ações</th></tr></thead>
                        <tbody id="tabelaCategorias"><tr><td colspan="3">Carregando categorias...</td></tr></tbody>
                    </table>
                </div>
                <nav id="paginacaoCategorias" class="paginacao-produtos" aria-label="Paginação de categorias" hidden>
                    <button type="button" id="btnPaginaAnterior" class="btn-pagina">Anterior</button>
                    <span id="infoPaginacao" aria-live="polite"></span>
                    <button type="button" id="btnProximaPagina" class="btn-pagina">Próxima</button>
                </nav>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="../javascript/Categoria.js"></script>
    <script src="../componente/menu/menu.js"></script>
</body>
</html>
