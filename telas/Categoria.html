<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style/universalStyle.css">
    <title>Cadastro de Categoria de Produto</title>
</head>

<body>

    <menu-page></menu-page>

    <main class="container">
        <h1>Cadastro de Categoria de Produto</h1>

        <form id="formCategoriaProduto" class="form-cliente">

            <div class="campo">
                <label for="categoriaProdutoId">Código</label>
                <input type="number" id="categoriaProdutoId" placeholder="Gerado automaticamente" readonly>
            </div>

            <div class="campo">
                <label for="dsCategoriaProduto">Descrição / Nome</label>
                <input type="text" id="dsCategoriaProduto" maxlength="100" placeholder="Ex: Eletrônicos, Alimentos" required>
            </div>

            <div class="campo nome">
                <label for="obsCategoriaProduto">Observação</label>
                <input type="text" id="obsCategoriaProduto" maxlength="255" placeholder="Digite uma observação (Obrigatório)" required>
            </div>

            <div class="campo nome">
                <label for="campoPesquisa">Pesquisa de Categoria</label>
                <div class="campoPesquisa">
                    <input type="text" id="campoPesquisa" maxlength="255" placeholder="Pesquise uma Categoria em especifica">
                    <button type="submit" id="btnPesquisar" class="btn-pesquisar" value="Pesquisar">Pesquisar</button>
                </div>
            </div>

            <div class="acoes">
                <button type="reset" class="btn-limpar">Limpar</button>
                <button type="button" id="btnCancelarEdicao" class="btn-cancelar-edicao">Cancelar edição</button>
                <button type="submit" id="btnSalvar" class="btn-salvar">Salvar</button>
            </div>
        </form>

        <p id="mensagem" class="mensagem"></p>

        <h2>Categorias Cadastradas</h2>

        <table>
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Descrição</th>
                    <th>Observação</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaCategorias">
                <tr>
                    <td colspan="4">Carregando categorias...</td>
                </tr>
            </tbody>
        </table>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="../javascript/Categoria.js"></script>
    <script src="../componente/menu/menu.js"></script>

</body>

</html>
