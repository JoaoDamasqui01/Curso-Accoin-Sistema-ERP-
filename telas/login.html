<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sistema ERP</title>
  <link rel="icon" type="image/png" href="../Imagem/dittoFlow.png">
  <link rel="stylesheet" href="../style/loginStyle.css">

  <script>
    // Se O USUÁRIO JÁ ESTIVER LOGADO, manda direto para a Home!
    if (sessionStorage.getItem('usuarioLogado') === 'true') {
      window.location.replace('Home.html');
    }
  </script>
</head>

<body>
  <main class="card-login">
    <!-- Container do Ditto centralizado e saltando para fora no topo -->
    <div class="login-image-container">
      <img src="../Imagem/dittoFlow.png" alt="Logo Ditto" class="img-ditto">
    </div>

    <form id="formLogin" class="form-body" novalidate>
      <div class="campo">
        <label for="usuario">E-mail</label>
        <input type="email" id="usuario" name="email" placeholder="voce@exemplo.com" autocomplete="email" required>
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Senha" autocomplete="current-password" required>
      </div>
      <div id="mensagemErro" class="mensagem-erro" role="alert" aria-live="polite"></div>
      <button type="submit" class="btn-login" id="btnLogin">Fazer login</button>
      <div class="forgot-password-container">
        <a href="#" id="esqueceuSenha" class="forgot-password">Esqueceu a senha?</a>
      </div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="../javascript/login.js"></script>
</body>

</html>
